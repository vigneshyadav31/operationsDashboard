# ──────────────────────────────────────────────────────────────────────────────
# The Operations Dashboard — Docker Compose
#
# One service that builds the Dockerfile and serves the API + built client on
# http://localhost:4000. Runs with ZERO API keys (every adapter falls back to
# deterministic sample() data); supply keys by filling in .env.
#
#   docker compose up --build        # build image and start
#   docker compose up -d             # start in the background
#   docker compose down              # stop and remove the container
#
# The SQLite database (server/data/ops.sqlite) is persisted in a named volume,
# so demo users, the cache, and the Action Queue survive restarts.
# ──────────────────────────────────────────────────────────────────────────────

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: operations-dashboard:latest
    container_name: operations-dashboard
    ports:
      - "4000:4000"
    # Load all env vars (provider keys + config) from the root .env file.
    # Missing/blank keys are fine — adapters degrade to sample() data.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    volumes:
      # Persist the SQLite database + WAL files across container restarts.
      - dashboard-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  dashboard-data:
    driver: local
