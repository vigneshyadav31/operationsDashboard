services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: operations-dashboard:latest
    container_name: operations-dashboard
    ports:
      - "4000:4000"

    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    volumes:

      - dashboard-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  dashboard-data:
    driver: local
